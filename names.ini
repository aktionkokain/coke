# `build.rs` turns this file into Rust constants at compile time, and the
# scripts under scripts\ read it directly. Change a name here, not in code.
#
# Syntax: `key = value`, `#` or `;` starts a comment. Values may contain dots,
# hyphens and underscores. Do not quote values.
# Display name of the project and the "Coke" in the log banner.
product_name = Coke

# Config file next to the game executable.
config_file = coke_config.ini

# Older config file names still read (fallback order), comma separated.
legacy_config_files = kokain_config.ini, cmbs-perf.ini

# Runtime log next to the game executable.
log_file = coke.log

# Folder the native modloader creates next to the executable, and the prefix
# and suffix of the per-mod consent file inside it (<prefix><stem><suffix>).
mod_dir = coke
consent_prefix = user_consent_
consent_suffix = .txt

# Folder holding per-build profiles.
profile_dir = profiles

# Drop-in zip with every profile folder, extracted into profile_dir on startup.
profiles_zip = PROFILES.zip

# Private folder under %LOCALAPPDATA% and the copy of the real system DLL in it.
temp_dir = coke-temp
real_dll = opengl32_real.dll

# Name of this proxy DLL itself.
proxy_dll = opengl32.dll
