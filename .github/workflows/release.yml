name: release

# Publish the verified release layout from scripts/package.ps1.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (32-bit MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Verify release tag matches the updater version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo package metadata' }
          $version = ($metadata.packages | Where-Object name -eq 'coke').version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME must match Cargo version v$version"
          }

      # package.ps1 builds the proxy and every default mod for i686 before it
      # stages dist\, so a fresh runner has the mod DLLs it needs.
      - name: Build release layout
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          gh release create $tag $assets --title $tag --generate-notes
