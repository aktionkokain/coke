# cokelos.ini - whole-map terrain line-of-sight (cursor probe)
# Place next to the game EXE, or in coke/ beside cokelos.dll. Every value is
# optional; the built-in defaults are shown below. Restart the game after
# editing. `#` or `;` starts a comment.

[los]
# The overlay is opt-in. The host also requires coke/user_consent_cokelos.txt
# before it loads cokelos.dll; this switch is the second gate.
#   1 = enable the mod, 0 = decline to load (default)
enabled=0

# Scan cell size in metres. The visibility grid covers the WHOLE map; 8 is the
# game's action spot. Smaller = finer contour and slower scans (2..32).
cell=8

# Observer eye height above the ground, metres (0.5..10).
eye=2.0

# Line width in physical pixels for the contour and rays (0.5..8).
line_width=2.0

# Number of radial rays from the observer to the visibility boundary
# (0..720). 0 draws only the contour.
rays=64

# Fill the visible cells with translucent green (0 = off).
alpha=0.20

# 1 = with a fill enabled, also draw blocked cells red.
show_blocked=0

# 1 = draw the status line under the FPS counter (default). 0 = silent.
show_status=1

# Height of a target above the ground, metres (0..6). Used by the probe line.
target_height=1.6

# Width of the probe line (selected unit -> cursor) in metres (0.2..8). Only
# drawn when a unit is selected; the fan itself is cursor-based.
lane=1.2
