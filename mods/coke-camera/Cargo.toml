[package]
name = "coke-camera"
version = "0.1.0"
edition = "2024"
description = "Reusable RTS-style camera controller for the coke host"

[lib]
name = "coke_camera"
crate-type = ["cdylib"]

[dependencies]
coke-host = { path = "../../crates/coke-host" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
