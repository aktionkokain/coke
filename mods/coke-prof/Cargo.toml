[package]
name = "coke-prof"
version = "0.1.0"
edition = "2024"
description = "coke/ profiler: frame, thread, GL-call and function-hotspot sampling"

[lib]
name = "coke_prof"
crate-type = ["cdylib"]

[dependencies]
coke-host = { path = "../../crates/coke-host" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
