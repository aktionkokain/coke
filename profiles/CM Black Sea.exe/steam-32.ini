; Combat Mission: Black Sea - verified 32-bit Steam build.
;
; Every address is an RVA (VA - preferred_base). The packed CMBS image loads at
; its preferred base and never relocates, but the accessors still add the live
; module base so the same file works on a machine where the loader disagrees.
;
; Identity: SizeOfImage 0x00a5f000, PE timestamp 0x63d82c90 and the .text hash
; must all match before any engine write is allowed.

[profile]
exe = CM Black Sea.exe
build = steam-32
status = verified
preferred_base = 0x00400000
image_size = 0x00a5f000
pe_timestamp = 0x63d82c90
text_fnv1a = 0xf7b80d9a

[slots]
close_window = 0x005d53e8
get_system_metrics = 0x005d5400
change_display = 0x005d5410
get_cursor_pos = 0x005d53dc

[canvas]
app_ptr = 0x009764b4
app_hwnd_off = 0xbac
size_tolerance_pct = 0

[scene]
owner_ptr = 0x0097a6b4
blur_quad_ptr = 0x0097a6c8
top_inset = 155
owner_widget_off = 0x20
widget_rect_off = 0x10
blur_quad_rect_off = 0x28
blur_quad_backlink_off = 0x54
blur_quad_enable_off = 0x50

[rtti]
View = 0x007ac7b4
GameView = 0x0079c05c
CommandView = 0x007994a0
UnitView = 0x007abaa8
SoldierView = 0x007aa134
CommandButtonPanel = 0x007992d8

[los]
world_ptr = 0x0097a6ac
scenario_ptr = 0x0097a6b8
action_map_off = 0x310
map_globals = 0x00974ea4,0x00974ea8
vt_action_map = 0x007979c8
vt_terrain_map = 0x007ab5d4
vt_mapview = 0x0079a5dc
vt_camera = 0x00798b00
vt_camera_persp = 0x00798b28
vt_unit = 0x00797d68
height_off = 0x9c
grid_w_off = 0xa0
grid_h_off = 0xa4
world_w_off = 0x04
world_h_off = 0x08

[range]
; Black Sea's Target ribbon queue, just before the engine draws it.
draw_call = 0x001d4013
draw_flush = 0x0039ad80
trace = 0x002145c0
ribbon = 0x003b0950
point_vtable = 0x00796f20
hud_call = 0x001d41e9
hud_draw = 0x001d42a0
label_draw = 0x00210740
label_width = 0x00210130
label_background = 0x003e44a0
