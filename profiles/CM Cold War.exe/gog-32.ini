; Combat Mission: Cold War - GOG 32-bit build.
;
; Status: verified on this build. Identity, RTTI, [canvas] and [scene] were
; validated in a live campaign battle: resize repeatedly, scene stayed below
; the command bar at y=155, HUD re-laid out, and click-to-unit picking stayed
; aligned. [scene] uses the widget-tree fallback because this build has no
; stable scene-owner global (see profiles/README.md and docs/ai/PORTING.md).

[profile]
exe = CM Cold War.exe
build = gog-32
status = verified
preferred_base = 0x00400000
image_size = 0x00b2b000
pe_timestamp = 0x68d02464
text_fnv1a = 0x8b23ec42

[rtti]
View = 0x00836a08
GameView = 0x00826340
CommandView = 0x008233a8
UnitView = 0x00835b8c
SoldierView = 0x00834488
CommandButtonPanel = 0x008237d4

; [slots] is intentionally absent: the generic IAT scanner finds and validates
; the four user32 slots on this build. Add it only if the scanner regresses.

; App object located from FUN_004000f0 (constructor) and FUN_00319110
; (CreateWindowExA). The constructor stores GetSystemMetrics(0/1) at app+0x00
; and app+0x04, the HWND at app+0xbac, and the object pointer in DAT_00b73e24.
; RVA = VA 0x00b73e24 - image base 0x00100000.
[canvas]
app_ptr = 0x00a73e24
app_hwnd_off = 0xbac
size_tolerance_pct = 0

; Cold War keeps the battle screen only in the heap: no static global holds the
; scene owner, so the schema's owner_ptr -> widget chain cannot be expressed.
; GameView is a direct child of the battle-screen View and is stable by RTTI,
; so resolve the scene widget from the live widget tree by class instead.
[scene]
widget_class = GameView
top_inset = 155
