; Combat Mission: Battle for Normandy - Battlefront 32-bit build.
;
; Partial port: live identity, UI RTTI, canvas and RTTI-resolved scene validated.
; Profile matching across restarts, menu/battle resize, F11, maximize/restore,
; alt-tab, click-to-unit picking, profile-absence safe mode and no-consent mod
; skipping passed testing. Status remains partial due to the caveat below.
; Do not mark verified until the PORTING.md acceptance checklist passes.
; Authoring caveat: start with window_scale=100 in coke_config.ini. A 75%
; startup window can be hooked after the engine cached the full desktop size,
; causing the host's canvas-history validation to reject the initial canvas.
; Executable SHA256 (identification only, not a profile match field):
; 51c65fc7fa62a854947f90cc72c0538c10352b6b0e3ae4e7180177cfa788a5d2

[profile]
exe = CM Normandy.exe
build = battlefront-32
status = partial
preferred_base = 0x00400000
image_size = 0x00d90000
pe_timestamp = 0x664e7119
text_fnv1a = 0xc860ca92

; Resolved by MSVC RTTI class name in the live engine. Values are module RVAs;
; the host validates RTTI names before accepting these as fallback vtables.
[rtti]
View = 0x00913830
GameView = 0x00902d8c
CommandView = 0x00900084
UnitView = 0x0091285c
SoldierView = 0x009111d4
CommandButtonPanel = 0x008ffebc

; Constructor at RVA 0x00300150 stores GetSystemMetrics(0/1) at app+0/+4,
; stores the HWND at app+0xbac, and publishes app through this module global.
; The window procedure uses app[1] - mouse_y - 1 for mouse coordinates.
; Read-only live inspection confirmed the canvas and matching game HWND.
[canvas]
app_ptr = 0x00cd5e18
app_hwnd_off = 0xbac
size_tolerance_pct = 0

; [slots] is absent: the generic IAT scanner found and validated all four
; user32 slots on this build. [los] is not implemented.

; The live battle widget tree identifies GameView as a child of the battle
; screen View, at (0,155,canvas_width,canvas_height-155). Resolve by RTTI;
; no static scene-owner address is needed.
[scene]
widget_class = GameView
top_inset = 155
