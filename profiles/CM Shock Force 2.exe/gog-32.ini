; Combat Mission: Shock Force 2 - GOG 32-bit build.
;
; Engine addresses are RVAs (VA - preferred_base). The accessors add the live
; module base at runtime. Object field offsets are relative to the object.
;
; Status: verified live on 2026-11-16. Windowed mode, F11, resize, battle UI
; re-layout and the scene rect all worked on the GOG 32-bit build. Identity,
; slots, RTTI, [canvas] and [scene] were all exercised by that run.
;
; Identity: SizeOfImage 0x00b3d000, PE timestamp 0x696fead4 and the .text hash
; must all match before any engine write is allowed.

[profile]
exe = CM Shock Force 2.exe
build = gog-32
status = verified
preferred_base = 0x00400000
image_size = 0x00b3d000
pe_timestamp = 0x696fead4
text_fnv1a = 0x115cb589

[slots]
; user32 IAT slots, taken from the PE import table (iat_rva).
; GetCursorPos [0x9cc3ec], ChangeDisplaySettingsA [0x9cc420],
; GetSystemMetrics [0x9cc430], CloseWindow [0x9cc448].
close_window = 0x005cc448
get_system_metrics = 0x005cc430
change_display = 0x005cc420
get_cursor_pos = 0x005cc3ec

[canvas]
; [0xe53884] = app object (FUN_006f8690 writes it); hwnd at app+0xbac.
; canvas width/height live at app+0x00/app+0x04.
app_ptr = 0x00a53884
app_hwnd_off = 0xbac
size_tolerance_pct = 0

[scene]
; [0xe57af8] = battle/session object; scene widget at owner+0x20
; (FUN_0079eda0 stores FUN_005cb4a0 there).
; [0xe57b0c] = blur quad, allocated 0x5c bytes by FUN_0071c440 with the scene
; widget's i16 rect copied to +0x28, enable flag at +0x50 and widget backlink
; at +0x54.
owner_ptr = 0x00a57af8
blur_quad_ptr = 0x00a57b0c
top_inset = 155
owner_widget_off = 0x20
widget_rect_off = 0x10
blur_quad_rect_off = 0x28
blur_quad_backlink_off = 0x54
blur_quad_enable_off = 0x50

[rtti]
View = 0x007aa230
GameView = 0x00799b1c
CommandView = 0x00796b64
UnitView = 0x007a9590
SoldierView = 0x007a7c24
CommandButtonPanel = 0x00796f74

; Read-only terrain anchors validated in a live SF2 setup-phase battle on
; 2026-11-22. These do not enable CokeLOS: that needs separate MapView/camera
; and occlusion contracts. The globals both point to the live ActionMap.
[terrain]
world_ptr = 0x00a57b00
map_globals = 0x00a52354, 0x00a52358
vt_action_map = 0x007955a0
vt_terrain_map = 0x007a9034
height_off = 0x9c
grid_w_off = 0xa0
grid_h_off = 0xa4
world_w_off = 0x04
world_h_off = 0x08

; [los] is intentionally absent. CokeLOS remains disabled; terrain discovery
; is recorded separately above so it does not imply a complete LOS adapter.

[range]
; Native Target trace, styled ribbon builder, draw queue and HUD helpers.
; Command state 0 permits CokeRange. Stock Target uses state 2.
draw_call = 0x001cdc83
draw_flush = 0x003930f0
trace = 0x0020d700
ribbon = 0x003a88a0
ribbon_pool_off = 0xc8c4
point_vtable = 0x00794b8c
hud_call = 0x001cde59
hud_draw = 0x001cdf20
label_draw = 0x00209870
label_width = 0x00209260
label_background = 0x003dba90
