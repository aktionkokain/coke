# ============================================================================
# coke_config.ini - config for the Coke Mod.
# ============================================================================
# Uninstall by deleting opengl32.dll and this file from the game folder.
# Every value below is optional; delete the file to use the built-in defaults.
#
# Notes
#   * Values are read once at process start. Restart the game after editing.
#   * F11 always toggles between "framed window" and "borderless fullscreen"
#     at runtime, no restart needed.
#   * Numbers or simple words (on/off, F1-F12, priority names); `#` or `;` starts
#     a comment.
#   * Native code mods: put a DLL in `coke/` next to the EXE and a matching
#     `user_consent_<dllname>.txt` beside it. Delete the consent file to stop
#     that DLL from loading. See README.md.
# ============================================================================


[display]
# Logical render resolution the engine draws in.
#   0 = follow the window (recommended): the engine is told the client area's
#       real pixel size, so it renders natively at the size the window actually
#       is. No scaling is applied and the cursor mapping is the identity - this
#       is the mode where unit picking is exact at any window size.
# Set both to pin a fixed internal resolution instead: the engine then always
# renders at that size and the mod scales the image to the window. Cheaper on
# the GPU, softer on screen, and the engine's canvas no longer matches the real
# client surface.
width=0
height=0

# Start in borderless fullscreen instead of a framed window.
#   0 = launch windowed, press F11 for fullscreen (default)
#   1 = launch fullscreen; F11 returns to a framed window
fullscreen=0

# Size of the framed window, as a percentage of the MONITOR.
# 75 = three quarters (e.g. 1920x1080 on a 2560x1440 monitor).
# 100 = native monitor size (the framed window may be clamped by the work area
#       and taskbar; use fullscreen/F11 for a true 1440p client).
# Deliberately based on the monitor, not the logical resolution: the engine's
# canvas can be much smaller than the screen (a 1024x768 game on a 1440p
# desktop) and the window must not shrink to match it.
window_scale=75

# Pixels shaved off the borderless fullscreen window.
# A window that covers the monitor exactly is treated by Windows as a
# fullscreen app, and entering/leaving that mode blanks the display on some
# machines. Leaving a 1 px gap avoids it; the gap is not visible.
#   0 = cover the monitor exactly
#   1 = 1 px inset (default, avoids the display blank)
fullscreen_inset=1

# Which edge gives up the inset pixels.
#   top (default) = gap above the window, so the bottom edge stays flush with
#                   the screen and cannot click through to the taskbar
#   bottom | left | right | right_bottom
fullscreen_inset_edge=top

# Fill the window, or keep the exact aspect ratio.
#   1 = stretch to fill (distorts a 4:3 game on a 16:9 window)
#   0 = keep the aspect ratio and centre the image (black bars, no distortion)
stretch=0


[performance]
# Frame cap.
#   0   = uncapped. The engine will render menus at several hundred fps.
#   60  = palatable, low CPU. 120/144/240 match high-refresh monitors.
limit_fps=0

# Vertical sync: on / off / auto
#   auto = leave the engine's own setting alone (it asks for off)
#   on   = tear-free, but the frame rate is tied to the monitor
#   off  = never wait for the display
vsync=off

# Process priority class: idle / below_normal / normal / above_normal / high
# The engine already asks for above_normal; "high" can help a little when
# other applications are running. "unset" leaves it completely alone.
priority=above_normal

# CPU affinity: all / 0x3 / 3 / 0-3,6
# "all" lets Windows schedule wherever it likes (recommended).
affinity=all

# Raise worker threads that the engine left at IDLE priority.
# No-op on this build: the engine sets ABOVE_NORMAL and its threads already
# run at Normal or TimeCritical. Kept for other builds.
boost_workers=0


[compat]
# Keep the last presented frame when the game loses focus, instead of
# minimising the GL window (which causes the black flash on alt-tab).
fix_alt_tab=1

# Apply the logical -> physical mapping (viewports, scissor, cursor).
# Only set this to 0 to debug the mod itself: the picture will then sit in
# the bottom-left corner at the logical size.
scale_fixes=1

# Promote the in-game 3D scene sub-viewport to the full canvas.
# Leave this at 0. It only helps if the engine's canvas already fills the
# logical screen; when the engine blits a smaller canvas (game resolution
# below the logical resolution) it stretches the picture but NOT the engine's
# hit-testing, which puts every unit click in the wrong place.
promote_scene=0

# Write the new client size into the engine's cached canvas after a resize.
# The engine reads this cached pair for UI layout and for the mouse Y
# inversion, and its window procedure ignores WM_SIZE, so posting WM_SIZE
# cannot relayout it. This is what makes maximize/F11 actually use the new
# size instead of drawing the startup size in the corner.
#   1 = on (default). Requires a matching profile with a [canvas] block; without
#       one the log says "canvas patch: profile has no [canvas] block" and the
#       old behaviour is kept.
#   0 = off (old follow-window behaviour).
canvas_patch=1

# Expand a stale full-screen viewport that still uses the startup canvas
# (e.g. (0,0,1920,1080) after the window grows). This removes black areas
# outside the old canvas. Applies wherever the engine still draws a full-screen
# pass at the old canvas - battle background passes and the menu background
# alike. 1 = on (default), 0 = off.
stale_viewport_fix=1

# Restore the battle scene's position when the canvas grows. After a resize
# the engine lays the scene out at y=0 (`(0,0,w,h-155)`) instead of below the
# command bar - the picture shifts down and the top band turns black, and
# clicking 3D units lands 155 px off. The repair finds the engine's render
# target and its scene widget in memory and corrects their y to the inset, so
# the drawn viewport AND the click-to-unit picking move together.
#   1 = on (default), 0 = off.
scene_rect_fix=1

# Legacy fallback for scene_rect_fix: rewrite the *drawn* viewport
# ((0,0,w,h-155) -> (0,155,w,h-155)) instead of the engine's rects. The
# engine keeps picking with its own un-rewritten rect, so every unit click
# lands 155 px off - keep this at 0 unless you specifically want to compare
# the two approaches. 0 = off (default), 1 = on.
scene_vp_rewrite=0

# Top inset (logical pixels) reserved above the battle scene for the command
# bar. 0 = learn it at runtime from a battle frame drawn at the startup canvas
# (falls back to the engine's 155). Only override this if the scene band is
# wrong on a build whose constant differs.
scene_inset=0

# Re-center UI widgets that were laid out for the startup or previous canvas
# after the canvas changes (menu panel, dialogs, the alt+q quit dialog).
# Unlike the viewport fixes above this repairs the engine's own widget rects,
# so drawing AND mouse hit testing both move together. The scan runs
# incrementally on the watcher thread (a few ms per tick) over the whole
# 32-bit user space, so it does not stall the game even on large heaps.
#   1 = on (default), 0 = off.
menu_recenter=0

# TEMPORARY DIAGNOSTIC (native re-layout work): dump the engine's live widget
# tree, read-only, to coke.log. Fires ~0.9 s after every canvas change,
# on the first battle frame after a canvas change, and on F9.
# The dump never writes to game memory. 1 = on (default in this build),
# 0 = off.
widget_dump=1

# Native UI re-layout after a resize/F11/maximize: replay the engine's own
# widget rects against the new canvas, using the layout rules recovered from
# the binary (scene inset 155, battle bar flanks = (canvas_w-1024)/2, menus
# centred). This is what makes the menu, the battle HUD and dialogs react to
# the window size instead of staying at the startup geometry.
#   0 = off (old behaviour: the picture stays at the startup layout)
#   1 = apply (default)
#   2 = dry-run: log the planned rects, write nothing
widget_relayout=1

# Delay between the canvas change and the re-layout pass, in milliseconds.
# 30 ms is ~2 frames: enough for the new client size to be live, short enough
# that the resize looks instant. The watcher polls every 2 ms while a
# re-layout is armed, so this is the real end-to-end delay.
relayout_delay_ms=30

# Advanced isolation switches. Leave both at 1 for normal use.
#   hook_slots  = patch the engine's user32 import slots (screen size, cursor,
#                 display mode). 0 disables all display-size/cursor changes.
#   hook_cbt    = install the create-window (WH_CBT) hook on the engine's
#                 threads. 0 leaves window creation completely untouched.
#   hook_window = find and subclass the game window, start mode, F11, resize.
# Set one to 0 only to find which subsystem a crash comes from.
hook_slots=1
hook_cbt=1
hook_window=1
hook_wndproc=1
# Intercept the close box/system close command with ExitProcess (1), or let
# the game's normal shutdown path run (0).
forced_exit=1
hook_mode=1


[debug]
# Log the GL renderer, viewport sizes, window geometry and fps to
# coke.log next to the EXE.
verbose=1

# Draw the yellow FPS counter in the top-right corner (1 = on).
show_fps=1

# Function key that toggles the FPS counter at runtime: F1-F12, or off.
# F10 is shared with the coke-fps sample mod; both counters toggle together
# unless one side is disabled. F7/F8 belong to coke-prof, F9 dumps widgets and
# F11 toggles the window mode. See docs/ai/CONFIG.md.
fps_hotkey=F10

# cokelos camera handedness: flip if the fan is mirrored left/right or up/down
los_flip_x=0
los_flip_y=0

# cokelos: project against the scene widget rect instead of the full window.
# Leave 0 on this build (the engine's 3D viewport is the whole window).
los_scene_rect=0

# cokelos: percent of the window height at the bottom that is HUD. The overlay
# is clipped above it so it never paints over the command panel. 0 = no clip.
los_clip_bottom_pct=17

# Profile-authoring aid: log the live build identity once at startup - module
# base, live SizeOfImage, live PE timestamp, .text FNV-1a, the selected profile
# and its blocks, slot RVAs and the resolved RTTI vtables. These live values are
# the only authoritative source for a new profile: the loader rewrites the PE
# header in memory, so the timestamp read from the file on disk does not match
# the profile. Works in safe mode. Read docs/ai/PORTING.md section 2 before using it.
#   0 = off (default), 1 = log once at startup
profile_dump=0

# Decompiling aid: write the live main module to analysis\<exe>-image-pe.bin
# once, after the packed game image has unpacked. The file contains the game's
# code; keep it out of the repository. Read docs/ai/DECOMPILING.md before using it.
#   0 = off (default), 1 = dump once
dump_module=0
