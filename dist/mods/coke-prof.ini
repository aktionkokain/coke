# coke-prof.ini - in-process profiler for Combat Mission (coke/ mod)
# Place next to the game EXE or in coke/ beside coke_prof.dll.
# Every value is optional; the built-in defaults are shown below.
# Restart the game after editing. `#` or `;` starts a comment.

[prof]
# 1 = load and run the profiler, 0 = decline to load.
enabled=1

# Draw the HUD in the top-left, below the FPS/LOS lines. F8 toggles it.
hud=1

# Sample the OpenGL thread's instruction pointer. This is a poor-man's
# sampling profiler: it briefly suspends the render thread. Leave it off if
# you see stutter or instability.
sample=0

# Samples per second (1..200).
sample_hz=25

# How often to update the HUD and append a CSV row, milliseconds.
interval_ms=1000

# Number of hottest sampled functions to show.
top=3

# Append one row per interval to coke-prof.csv next to the EXE.
log=1

# Ask the proxy to time glCallList and glBindTexture with QPC. This adds a
# small per-call cost; off by default. Turn it on only for a short run that
# needs the per-call time, not for a count-only baseline.
timing=0
