; The controller is enabled by default. Set enabled=0 to return to vanilla
; camera input; when enabled, the host claims the native camera boundary.
enabled=1
pan_speed=60
yaw_per_pixel=0.003
pitch_per_pixel=0.002
wheel_step=6
shift_multiplier=4
ctrl_multiplier=0.5
mmb_sensitivity=0.36
; F6 toggles free-camera flight. Use an unclaimed F1-F12 key (F9/F11 reserved).
freecam_fkey=6
; 0 keeps the camera above terrain/map bounds; 1 allows free flight through them.
freecam_noclip=0
; RMB rotation scales with current FOV / reference FOV while zoomed in.
zoom_reference_fov=45
zoom_drag_floor=0.12
